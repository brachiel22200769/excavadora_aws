<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Control - Excavadora IoT</title>
<style>
    /* VARIABLES Y FUENTES */
    :root {
        --orange-main: #e69138;
        --dark-bg: rgba(20, 20, 20, 0.85);
        --text-light: #ecf0f1;
        --success: #2ecc71;
        --danger: #e74c3c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    
    body {
        background-color: #5c94fc;
        background-image: url('Fondo.jpg');
        background-size: cover;
        background-position: center bottom;
        background-attachment: fixed;
        color: var(--text-light);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* BARRA SUPERIOR (HEADER) */
    header {
        background-color: rgba(0, 0, 0, 0.9);
        border-bottom: 4px solid var(--orange-main);
        padding: 10px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    header h1 { font-size: 1.5rem; color: #f1c40f; text-shadow: 2px 2px #000; margin: 0;}
    .status-indicator { display: flex; align-items: center; gap: 15px; font-weight: bold; font-size: 1.1rem; }
    .dot { width: 18px; height: 18px; background-color: #777; border-radius: 50%; box-shadow: inset 0 0 5px #000; }
    .dot.on { background-color: var(--success); box-shadow: 0 0 15px var(--success); }
    .dot.sim { background-color: var(--orange-main); box-shadow: 0 0 15px var(--orange-main); }
    .dot.err { background-color: var(--danger); box-shadow: 0 0 15px var(--danger); }

    /* LAYOUT PRINCIPAL (2 COLUMNAS) */
    .dashboard {
        display: flex;
        flex-grow: 1;
        padding: 20px;
        gap: 20px;
        height: calc(100vh - 60px);
    }

    /* COLUMNA IZQUIERDA: PANELES DE INFORMACIÓN */
    .sidebar {
        width: 350px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .panel {
        background-color: var(--dark-bg);
        border: 2px solid #555;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
        overflow: hidden;
    }
    .panel-half { height: 50%; }
    .panel h3 {
        background-color: #111;
        color: var(--orange-main);
        padding: 10px;
        text-align: center;
        border-bottom: 2px solid #444;
        font-size: 1.1rem;
        letter-spacing: 1px;
    }

    /* HISTORIAL */
    #historyList {
        list-style: none;
        overflow-y: auto;
        padding: 15px;
        font-size: 0.9rem;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        gap: 5px;
    }
    #historyList li { border-bottom: 1px dashed #444; padding-bottom: 5px; color: #ccc; }
    #historyList li b { color: #f1c40f; }

    /* CREADOR DE DEMOS */
    .demo-builder { padding: 15px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto;}
    .demo-controls { display: flex; gap: 5px; flex-wrap: wrap;}
    .demo-controls select, .demo-controls input {
        background: #222; color: #fff; border: 1px solid #555; padding: 8px; border-radius: 4px; font-family: inherit;
    }
    .demo-controls select { flex-grow: 1; }
    .demo-controls input { width: 80px; }
    .btn { padding: 8px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-family: inherit; transition: 0.2s;}
    .btn:active { transform: scale(0.95); }
    .btn-add { background-color: #3498db; color: white; width: 100%;}
    .btn-play { background-color: var(--success); color: white; flex-grow: 1; font-size: 1.1rem;}
    .btn-clear { background-color: var(--danger); color: white; }
    
    #demoSequence {
        background: #111; padding: 10px; border-radius: 5px; min-height: 80px; font-size: 0.8rem; color: #aaa;
    }

    /* COLUMNA DERECHA: EL CONTROL REMOTO (Tu diseño original mejorado) */
    .main-control-area {
        flex-grow: 1;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .remote-body {
        background-color: var(--orange-main);
        border-radius: 30px 30px 50px 50px;
        width: 100%;
        max-width: 800px;
        position: relative;
        box-shadow: inset -5px -5px 0px rgba(0, 0, 0, 0.3), inset 5px 5px 0px rgba(255, 255, 255, 0.3), 15px 15px 25px rgba(0, 0, 0, 0.7);
        border: 6px solid #222;
        padding: 30px 40px;
        display: flex;
        flex-direction: column;
    }

    .top-plate {
        background-color: #222;
        color: #f1c40f;
        width: 350px;
        margin: -30px auto 30px auto;
        padding: 15px;
        border-radius: 0 0 20px 20px;
        font-weight: 900;
        font-size: 28px;
        text-align: center;
        border-bottom: 5px solid #000;
        text-shadow: 2px 2px #000;
        letter-spacing: 3px;
        box-shadow: 0 5px 10px rgba(0,0,0,0.5);
    }

    .control-grid {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    /* JOYSTICKS CIRCULARES NEGROS */
    .joy-wrap { display: flex; flex-direction: column; align-items: center; gap: 15px;}
    .joy-label { background: #222; padding: 5px 15px; border-radius: 10px; font-weight: bold; border: 2px solid #111; box-shadow: 2px 2px 0 #000;}
    
    .d-pad-ring {
        background-color: #222;
        width: 240px;
        height: 240px;
        border-radius: 50%;
        position: relative;
        box-shadow: inset 5px 5px 15px rgba(0, 0, 0, 0.9), 5px 5px 0px rgba(0, 0, 0, 0.3);
        border: 5px solid #111;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .joy-stick {
        width: 80px;
        height: 80px;
        background: radial-gradient(circle at 30% 30%, #ecf0f1, #7f8c8d);
        border-radius: 50%;
        position: absolute;
        box-shadow: 5px 5px 15px rgba(0,0,0,0.8), inset -2px -2px 5px rgba(0,0,0,0.5);
        cursor: grab;
        z-index: 5;
        transition: transform 0.1s;
    }
    .joy-stick:active { cursor: grabbing; }

    /* Indicadores de dirección en los aros */
    .dir-hint { position: absolute; font-size: 0.8rem; font-weight: bold; color: #555; text-align: center;}
    .dir-hint.up { top: 10px; }
    .dir-hint.down { bottom: 10px; }
    .dir-hint.left { left: 10px; }
    .dir-hint.right { right: 10px; }
    .dir-hint b { display: block; font-size: 1.4rem; color: #777;}

    /* PANEL CENTRAL DE BOTONES */
    .center-panel {
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 140px;
    }
    .btn-center {
        background-color: #333;
        border: 4px solid #111;
        color: #fff;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 4px 4px 0 #111;
        font-weight: bold;
        font-size: 16px;
        padding: 15px 5px;
        text-align: center;
        text-shadow: 2px 2px #000;
        transition: 0.1s;
    }
    .btn-center:active { transform: translate(4px, 4px); box-shadow: 0 0 0 #111; }
    .btn-center.active-toggle {
        background-color: #f1c40f; color: #000; text-shadow: none; border-color: #d4ac0d;
        box-shadow: 0 0 20px #f1c40f, 4px 4px 0 #111;
    }

    /* BOTON INFERIOR DETENER */
    .bottom-plate {
        background-color: #222;
        margin: 10px auto -30px auto;
        width: 450px;
        padding: 20px;
        border-radius: 20px 20px 0 0;
        clip-path: polygon(5% 0, 95% 0, 100% 100%, 0 100%);
        border-top: 5px solid #111;
        display: flex;
        justify-content: center;
    }
    #btn-stop {
        background-color: #e74c3c;
        color: white;
        border: 4px solid #c0392b;
        width: 90%;
        padding: 15px;
        font-size: 24px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 4px 4px 0 #8b0000;
        text-shadow: 2px 2px #000;
        transition: 0.1s;
    }
    #btn-stop:active { transform: translate(4px, 4px); box-shadow: 0 0 0 #8b0000; }

</style>
</head>
<body>

<header>
    <h1>EXCAVADORA IOT</h1>
    <div class="status-indicator">
        <span id="header-status-text">CONECTANDO...</span>
        <span id="wsDot" class="dot" title="Estado de conexión"></span>
    </div>
</header>

<main class="dashboard">
    
    <!-- COLUMNA IZQUIERDA: HISTORIAL Y DEMOS -->
    <aside class="sidebar">
        <!-- Panel de Historial -->
        <div class="panel panel-half">
            <h3>HISTORIAL EN VIVO</h3>
            <ul id="historyList"></ul>
        </div>

        <!-- Panel de Demos (Creación y Ejecución) -->
        <div class="panel panel-half">
            <h3>CREADOR DE DEMOS</h3>
            <div class="demo-builder">
                <div class="demo-controls">
                    <select id="demoAction">
                        <option value="2">Avanzar (2)</option>
                        <option value="3">Retroceder (3)</option>
                        <option value="1">Girar Izquierda (1)</option>
                        <option value="4">Girar Derecha (4)</option>
                        <option value="10">Subir Brazo (10)</option>
                        <option value="11">Bajar Brazo (11)</option>
                        <option value="9">Cabina Izquierda (9)</option>
                        <option value="12">Cabina Derecha (12)</option>
                        <option value="7">Luces (7)</option>
                        <option value="5">Sonido (5)</option>
                    </select>
                    <input type="number" id="demoTime" value="1000" min="100" step="100" title="Tiempo en milisegundos">
                </div>
                <button class="btn btn-add" onclick="agregarPasoDemo()">+ AGREGAR PASO A LA SECUENCIA</button>
                
                <div id="demoSequence">Secuencia vacía...</div>
                
                <div class="demo-controls" style="margin-top: 5px;">
                    <button class="btn btn-play" onclick="reproducirDemo()">▶ EJECUTAR DEMO</button>
                    <button class="btn btn-clear" onclick="limpiarDemo()">🗑 LIMPIAR</button>
                </div>
            </div>
        </div>
    </aside>

    <!-- COLUMNA DERECHA: EL CONTROL REMOTO GIGANTE -->
    <section class="main-control-area">
        <div class="remote-body">
            
            <div class="top-plate">TRUCK CONTROL</div>

            <div class="control-grid">
                
                <!-- JOYSTICK IZQUIERDO -->
                <div class="joy-wrap">
                    <div class="joy-label">ORUGAS</div>
                    <div class="d-pad-ring">
                        <div class="dir-hint up"><b>▲</b>Fwd</div>
                        <div class="dir-hint down">Rev<b>▼</b></div>
                        <div class="dir-hint left"><b>◀</b>Izq</div>
                        <div class="dir-hint right">Der<b>▶</b></div>
                        <div class="joy-stick" id="joyLeft"></div>
                    </div>
                </div>

                <!-- BOTONES CENTRALES -->
                <div class="center-panel">
                    <button id="btn-7" class="btn-center" onclick="enviarComando(7); this.classList.toggle('active-toggle');">💡 LUCES (7)</button>
                    <button id="btn-5" class="btn-center" onclick="enviarComando(5); this.classList.toggle('active-toggle');">🔊 SONIDO (5)</button>
                    <button id="btn-8" class="btn-center" onclick="enviarComando(8)">✨ AUX (8)</button>
                </div>

                <!-- JOYSTICK DERECHO -->
                <div class="joy-wrap">
                    <div class="joy-label">CABINA / BRAZO</div>
                    <div class="d-pad-ring">
                        <div class="dir-hint up"><b>▲</b>Sube</div>
                        <div class="dir-hint down">Baja<b>▼</b></div>
                        <div class="dir-hint left"><b>◀</b>C.Izq</div>
                        <div class="dir-hint right">C.Der<b>▶</b></div>
                        <div class="joy-stick" id="joyRight"></div>
                    </div>
                </div>

            </div>

            <div class="bottom-plate">
                <button id="btn-stop" onclick="enviarComando(13)">⏹ DETENER TODO (13)</button>
            </div>

        </div>
    </section>

</main>

<script>
    // ==========================================
    // CONFIGURACIÓN DE RED (Dinámica para AWS)
    // ==========================================
    const host = window.location.host || "3.213.133.17:8000";
    const protocol = window.location.protocol === "https:" ? "https://" : "http://";
    const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
    
    // Apunta directamente a los endpoints de tu main.py (Vehículo 1 por defecto)
    const API_URL = `${protocol}${host}/api/vehiculos/1/movimiento`;
    const WS_URL = `${wsProtocol}${host}/ws`;
    
    console.log("URL configurada para base de datos:", API_URL);
    
    const wsDot = document.getElementById("wsDot");
    const headerStatus = document.getElementById("header-status-text");
    const historyList = document.getElementById("historyList");
    
    let ws;
    let modoSimulado = false;
    let lastCommand = 13;
    let secuenciaDemo = [];
    let isDemoRunning = false;

    const nombresAcciones = {
        1: "GIRANDO IZQUIERDA", 2: "AVANZANDO", 3: "RETROCEDIENDO", 4: "GIRANDO DERECHA",
        5: "SONIDO ON/OFF", 7: "LUCES ON/OFF", 8: "MODO AUX",
        9: "CABINA IZQUIERDA", 10: "SUBIR BRAZO", 11: "BAJAR BRAZO", 12: "CABINA DERECHA", 13: "DETENIDO"
    };

    // ==========================================
    // CONEXIÓN Y ENVÍO DE COMANDOS
    // ==========================================
    function activarModoSimulado() {
        modoSimulado = true;
        wsDot.className = "dot sim";
        headerStatus.innerText = "MODO SIMULADO (VISTA PREVIA)";
        headerStatus.style.color = "#f39c12";
    }

    function iniciarWebSocket() {
        try {
            ws = new WebSocket(WS_URL);
            ws.onopen = () => {
                modoSimulado = false;
                wsDot.className = "dot on";
                headerStatus.innerText = "CONECTADO A LA EXCAVADORA";
                headerStatus.style.color = "#2ecc71";
            };
            ws.onmessage = (event) => {
                // Aquí recibimos la retransmisión de AWS
            };
            ws.onclose = () => {
                if (!modoSimulado) {
                    wsDot.className = "dot err";
                    headerStatus.innerText = "DESCONECTADO - REINTENTANDO...";
                    headerStatus.style.color = "#e74c3c";
                    setTimeout(iniciarWebSocket, 3000);
                }
            };
            ws.onerror = () => activarModoSimulado();
        } catch (e) {
            activarModoSimulado();
        }
    }

    function enviarComando(cmdId) {
        if(cmdId !== 13 && cmdId === lastCommand) return; // Evitar spam del mismo comando
        lastCommand = cmdId;

        const nombreComando = nombresAcciones[cmdId] || `COMANDO ${cmdId}`;
        agregarAlHistorial(nombreComando);

        if (modoSimulado) return;

        // 1. ENVÍO DIRECTO AL WEBSOCKET (Movimiento sin latencia, ignora bloqueos de DB)
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ status: cmdId }));
        }

        // 2. PETICIÓN A LA BASE DE DATOS (Para guardar el historial)
        fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ 
                id_comando: cmdId, 
                origen: "Botonera Web" 
            })
        })
        .then(async (res) => {
            if (!res.ok) {
                const errorData = await res.json();
                // Si la BD falla, te lo mostramos en rojo en el historial
                agregarAlHistorial(`<span style="color: #e74c3c;">[INFO DB] ${errorData.detail || res.status}</span>`);
            }
        })
        .catch(error => console.error("Error POST:", error));
    }

    function agregarAlHistorial(texto) {
        const li = document.createElement("li");
        const timeStr = new Date().toTimeString().split(' ')[0];
        li.innerHTML = `[${timeStr}] <b>${texto}</b>`;
        historyList.prepend(li);
        if (historyList.children.length > 25) historyList.removeChild(historyList.lastChild);
    }

    // ==========================================
    // CREADOR DE DEMOS
    // ==========================================
    function agregarPasoDemo() {
        const actionId = parseInt(document.getElementById("demoAction").value);
        const duration = parseInt(document.getElementById("demoTime").value);
        const actionName = nombresAcciones[actionId];
        
        secuenciaDemo.push({ id: actionId, name: actionName, time: duration });
        actualizarTextoDemo();
    }

    function limpiarDemo() {
        secuenciaDemo = [];
        actualizarTextoDemo();
    }

    function actualizarTextoDemo() {
        const container = document.getElementById("demoSequence");
        if (secuenciaDemo.length === 0) {
            container.innerHTML = "Secuencia vacía...";
            return;
        }
        container.innerHTML = secuenciaDemo.map((paso, i) => 
            `<div>${i+1}. <b>${paso.name}</b> por ${paso.time}ms</div>`
        ).join('');
    }

    function reproducirDemo() {
        if (secuenciaDemo.length === 0 || isDemoRunning) return;
        isDemoRunning = true;
        agregarAlHistorial("=== INICIANDO DEMO PERSONALIZADA ===");
        
        let index = 0;
        
        function ejecutarSiguientePaso() {
            if (index >= secuenciaDemo.length) {
                enviarComando(13); // Detener al final
                agregarAlHistorial("=== FIN DE LA DEMO ===");
                isDemoRunning = false;
                return;
            }
            
            const paso = secuenciaDemo[index];
            enviarComando(paso.id);
            
            setTimeout(() => {
                enviarComando(13); // Parada de seguridad de medio segundo entre acciones
                setTimeout(() => {
                    index++;
                    ejecutarSiguientePaso();
                }, 500); 
            }, paso.time);
        }
        
        ejecutarSiguientePaso();
    }

    // ==========================================
    // LÓGICA DE LOS JOYSTICKS ARRASTRABLES
    // ==========================================
    function setupJoystick(joystickId, mapConfig) {
        const stick = document.getElementById(joystickId);
        const maxDist = 50; 
        let isDragging = false;
        let activeCommand = 13;

        function onStart(e) {
            if(isDemoRunning) return; // Bloquear manual si la demo corre
            isDragging = true;
            stick.style.transition = "none";
        }

        function onMove(e) {
            if (!isDragging) return;
            e.preventDefault(); 

            const rect = stick.parentElement.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let clientY = e.clientY || (e.touches && e.touches[0].clientY);

            let dx = clientX - centerX;
            let dy = clientY - centerY;
            
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance > maxDist) {
                dx = (dx / distance) * maxDist;
                dy = (dy / distance) * maxDist;
            }

            stick.style.transform = `translate(${dx}px, ${dy}px)`;

            let newCommand = 13;
            if (distance > 25) { 
                if (Math.abs(dx) > Math.abs(dy)) {
                    newCommand = dx > 0 ? mapConfig.right : mapConfig.left;
                } else {
                    newCommand = dy > 0 ? mapConfig.down : mapConfig.up;
                }
            }

            if(newCommand !== activeCommand) {
                activeCommand = newCommand;
                if(activeCommand !== 13) enviarComando(activeCommand);
            }
        }

        function onEnd(e) {
            if (!isDragging) return;
            isDragging = false;
            stick.style.transition = "transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
            stick.style.transform = `translate(0px, 0px)`;
            
            activeCommand = 13;
            enviarComando(13); 
        }

        stick.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        
        stick.addEventListener('touchstart', onStart, {passive: false});
        window.addEventListener('touchmove', onMove, {passive: false});
        window.addEventListener('touchend', onEnd);
    }

    // Configuración Orugas (Corregida: Izq manda 4, Der manda 1)
    setupJoystick('joyLeft', { up: 2, down: 3, left: 4, right: 1 });

    // Configuración Brazo/Cabina (Izq: 9, Sube: 10, Baja: 11, Der: 12)
    setupJoystick('joyRight', { up: 10, down: 11, left: 9, right: 12 });

    window.onload = () => {
        iniciarWebSocket();
        agregarAlHistorial("INTERFAZ CARGADA");
    };
</script>
</body>
</html>
